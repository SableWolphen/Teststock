name: Normalize Teststock dashboard freshness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-dashboard-freshness.mjs'
      - '.github/workflows/dashboard-freshness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-freshness
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize dashboard freshness semantics
        run: node scripts/normalize-dashboard-freshness.mjs
      - name: Publish dashboard cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/crypto.html
          if git diff --cached --quiet; then
            echo "Dashboard already normalized"
            exit 0
          fi
          git commit -m "Remove stale broker snapshot from dashboard"
          git pull --rebase -X theirs origin main
          git push
