name: Publish Teststock trading health

on:
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_run:
    workflows:
      - 'Refresh Teststock picks'
      - 'Fast Teststock opportunity refresh'
      - 'Monitor Teststock triggers'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/trading-health.yml'
      - 'scripts/build-daytrader-intelligence.mjs'
      - 'scripts/validate-daytrader-intelligence.mjs'
      - 'scripts/build-trade-quality-engine.mjs'
      - 'scripts/apply-model-drift.mjs'
      - 'scripts/validate-trade-quality-engine.mjs'
      - 'scripts/build-live-trading-health.mjs'
      - 'docs/trading-health.html'

permissions:
  contents: write
  actions: read

concurrency:
  group: teststock-trading-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture live-runner state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runner_state="$RUNNER_TEMP/teststock-live-runner-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/live-intraday-runner.yml/runs?per_page=20" > "$runner_state"
          echo "TESTSTOCK_RUNNER_RUNS_FILE=$runner_state" >> "$GITHUB_ENV"

      # Health describes the last published generation. Recovery belongs to the
      # serialized research/trigger publishers, never a parallel health job.
      - name: Publish fail-closed health even when recovery fails
        if: always()
        run: node scripts/build-live-trading-health.mjs

      - name: Publish health status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/live-trading-health.json
          if git diff --cached --quiet; then
            echo 'No health changes to publish.'
          else
            git commit -m 'Refresh Teststock trading health'
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying transient GitHub failure..." >&2
              sleep $((attempt * 3))
            done
            echo "Unable to publish trading health after 3 attempts." >&2
            exit 1
          fi
