name: ClaudeBot paper desks (after the close)
# After each US close (free, no Claude usage): paper-trade the research candidates on real daily closes.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * 1-5'   # ~4:20 PM CT (CST) / 5:20 PM CT (CDT), after the close
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/edge_paper.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Day-trade paper desk (replays today on 5-min bars)
        run: python claudebot/daytrade_paper_gh.py
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: "Dip-call desk (paper only - the options idea that won on history)"
        run: python claudebot/dipcall_paper.py
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Cheap dip-call desk (paper only - the same recipe with a contract the cap can buy)
        run: python claudebot/cheapcall_paper.py
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Cheap-stock call desk (paper only - a call near the price on stocks at $25 or less)
        run: python claudebot/cheapstock_paper.py
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Moonshot desk (paper only)
        run: python claudebot/hr.py active moxie && python claudebot/moonshot_paper.py || true
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Scoreboard - the bot vs holding SPY vs savings (reads ledgers only)
        run: python claudebot/scoreboard.py
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Options report card (reads result files only)
        run: python claudebot/options_report.py
        continue-on-error: true
      - name: Auto-promote paper-proven edges and roll back live losers (board order 2026-11-05)
        run: python claudebot/edge_promote.py
      - name: Historian (daily paper + weekly backtest leaderboard)
        run: python claudebot/historian.py
      - name: HR (fire agents whose work the evidence rejects)
        run: python claudebot/hr.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for f in docs/data/claudebot-scoreboard.json docs/data/claudebot-cheapstock-paper.json docs/data/claudebot-cheapcall-paper.json docs/data/claudebot-options-report.json docs/data/claudebot-dipcall-paper.json docs/data/claudebot-moonshot-paper.json docs/data/claudebot-hr.json docs/data/claudebot-edge-paper.json docs/data/claudebot-edge-readiness.json docs/data/claudebot-daytrade-paper.json docs/data/claudebot-historian.json claudebot/dip_config.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "Second-edge paper desk: daily update"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
