name: Refresh Teststock picks
# Scanner refreshes use private Alpaca credentials and the SEC contact identity.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-scan.yml'
      - 'api/picks.js'
      - 'scripts/generate-static-picks.mjs'
      - 'scripts/optimize-growth-plan.mjs'
      - 'scripts/generate-crypto-picks.mjs'
      - 'scripts/build-agent-signal.mjs'
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
    - cron: '15 */2 * * *'

permissions:
  contents: write

concurrency:
  group: static-scan
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate free static stock picks
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/generate-static-picks.mjs
      - name: Optimize aggressive growth plan
        run: node scripts/optimize-growth-plan.mjs
      - name: Generate selective crypto plan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/generate-crypto-picks.mjs
      - name: Build Claude/Robinhood signal
        run: node scripts/build-agent-signal.mjs
      - name: Publish refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/signal.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh static Teststock picks"
            git push
          fi
