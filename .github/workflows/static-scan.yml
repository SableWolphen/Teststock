name: Refresh Teststock picks
# GitHub + Alpaca do the background scanning. No chat model is called by this workflow.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-scan.yml'
      - 'api/picks.js'
      - 'scripts/generate-static-picks.mjs'
      - 'scripts/scan-small-account-options.mjs'
      - 'scripts/optimize-growth-plan.mjs'
      - 'scripts/generate-crypto-picks.mjs'
      - 'scripts/build-agent-signal.mjs'
      - 'scripts/validate-entry-gates.mjs'
      - 'scripts/apply-advanced-growth-guards.mjs'
      - 'scripts/apply-opportunity-expansion.mjs'
      - 'scripts/apply-probability-first-guards.mjs'
      - 'scripts/build-cross-asset-opportunity-ranking.mjs'
      - 'scripts/update-shadow-ledger.mjs'
      - 'scripts/augment-signal-safety.mjs'
      - 'scripts/validate-signal.mjs'
      - 'docs/real-fill-learning-policy.txt'
      - 'docs/teststock-real-trade-journal-template.json'
      - 'docs/strategy-changelog.txt'
  workflow_dispatch:
  schedule:
    # Offset from round-number cron minutes to reduce scheduler congestion.
    # Crypto refreshes every run, 24/7. Stocks/options refresh on the same cadence during the broad US-market UTC window.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: static-scan
  # Queue rather than cancel an in-flight generation. A cancelled generation cannot publish a fresh signal.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide scan depth
        id: scan_window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "stocks=true" >> "$GITHUB_OUTPUT"
            echo "deep=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dow=$(date -u +%u)
          hour=$(date -u +%H)
          minute=$(date -u +%M)

          if [ "$dow" -ge 1 ] && [ "$dow" -le 5 ] && [ "$hour" -ge 13 ] && [ "$hour" -le 21 ]; then
            echo "stocks=true" >> "$GITHUB_OUTPUT"
          else
            echo "stocks=false" >> "$GITHUB_OUTPUT"
          fi

          # Expensive historical validation/shadow resolution runs once per hour.
          # Live stock + crypto scanning and unified-signal publication still run every 10 minutes.
          if [ "$minute" = "03" ]; then
            echo "deep=true" >> "$GITHUB_OUTPUT"
          else
            echo "deep=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate fresh stock picks
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/generate-static-picks.mjs

      - name: Scan broader small-account option contracts
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
        run: node scripts/scan-small-account-options.mjs

      - name: Deep validate regime profiles and two untouched holdouts
        if: ${{ steps.scan_window.outputs.stocks == 'true' && steps.scan_window.outputs.deep == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/validate-entry-gates.mjs

      - name: Optimize growth plan with target2 reward-risk and cost-adjusted expectancy
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/optimize-growth-plan.mjs

      - name: Apply holdout-regime and event-risk guards
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/apply-advanced-growth-guards.mjs

      - name: Expand across multiple high-quality stock opportunities
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/apply-opportunity-expansion.mjs

      - name: Update accepted/rejected shadow ledger
        if: ${{ steps.scan_window.outputs.stocks == 'true' && steps.scan_window.outputs.deep == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/update-shadow-ledger.mjs

      - name: Generate fresh crypto plan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/generate-crypto-picks.mjs

      - name: Apply probability-first stock options crypto overlay
        run: node scripts/apply-probability-first-guards.mjs

      - name: Rank qualified opportunities across asset classes
        run: node scripts/build-cross-asset-opportunity-ranking.mjs

      - name: Build, augment, and validate Claude/Robinhood signal with fallback
        shell: bash
        run: |
          set -u
          if [ -f docs/signal.json ]; then cp docs/signal.json /tmp/teststock-last-good-signal.json; fi
          if node scripts/build-agent-signal.mjs && node scripts/augment-signal-safety.mjs && node scripts/validate-signal.mjs docs/signal.json; then
            echo "Fresh signal passed validation"
          else
            echo "Fresh signal failed generation or validation; restoring last known-good signal"
            if [ -f /tmp/teststock-last-good-signal.json ]; then
              cp /tmp/teststock-last-good-signal.json docs/signal.json
            else
              echo "No prior signal exists to restore" >&2
              exit 1
            fi
          fi

      - name: Publish refreshed JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/signal.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh static Teststock picks"
            git pull --rebase origin main
            git push
          fi
