name: Refresh Teststock picks
# GitHub + Alpaca do the background scanning. No chat model is called by this workflow.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-scan.yml'
      - 'api/picks.js'
      - 'scripts/generate-static-picks.mjs'
      - 'scripts/expand-stock-universe.mjs'
      - 'scripts/validate-universe-health.mjs'
      - 'scripts/enrich-stock-finalists.mjs'
      - 'scripts/validate-portfolio-correlation.mjs'
      - 'scripts/validate-exit-policy.mjs'
      - 'scripts/build-champion-challenger.mjs'
      - 'scripts/scan-small-account-options.mjs'
      - 'scripts/optimize-growth-plan.mjs'
      - 'scripts/enforce-model-sizing-lock.mjs'
      - 'scripts/generate-crypto-picks.mjs'
      - 'scripts/build-agent-signal.mjs'
      - 'scripts/validate-entry-gates.mjs'
      - 'scripts/apply-advanced-growth-guards.mjs'
      - 'scripts/apply-opportunity-expansion.mjs'
      - 'scripts/apply-probability-first-guards.mjs'
      - 'scripts/build-cross-asset-opportunity-ranking.mjs'
      - 'scripts/update-shadow-ledger.mjs'
      - 'scripts/augment-signal-safety.mjs'
      - 'scripts/apply-fractional-protection-policy.mjs'
      - 'scripts/apply-exit-policy-validation.mjs'
      - 'scripts/apply-strategy-intelligence.mjs'
      - 'scripts/apply-operational-safety.mjs'
      - 'scripts/validate-signal.mjs'
      - 'scripts/validate-execution-dispatch.mjs'
      - 'docs/real-fill-learning-policy.txt'
      - 'docs/teststock-real-trade-journal-template.json'
      - 'docs/live-trade-state-template.json'
      - 'docs/strategy-changelog.txt'
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: static-scan
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide scan depth
        id: scan_window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "stocks=true" >> "$GITHUB_OUTPUT"
            echo "deep=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dow=$(date -u +%u)
          hour=$(date -u +%H)
          minute=$(date -u +%M)
          if [ "$dow" -ge 1 ] && [ "$dow" -le 5 ] && [ "$hour" -ge 13 ] && [ "$hour" -le 21 ]; then
            echo "stocks=true" >> "$GITHUB_OUTPUT"
          else
            echo "stocks=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$minute" = "03" ]; then
            echo "deep=true" >> "$GITHUB_OUTPUT"
          else
            echo "deep=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate baseline stock picks
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/generate-static-picks.mjs

      - name: Expand across all active tradable US operating-company stocks
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/expand-stock-universe.mjs

      - name: Validate full-universe tournament health
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/validate-universe-health.mjs

      - name: Enrich finalists with SEC fundamentals and corporate actions
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/enrich-stock-finalists.mjs

      - name: Build portfolio correlation and concentration guard
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/validate-portfolio-correlation.mjs

      - name: Scan broader small-account option contracts
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
        run: node scripts/scan-small-account-options.mjs

      - name: Deep validate regime profiles and two untouched holdouts
        if: ${{ steps.scan_window.outputs.deep == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/validate-entry-gates.mjs

      - name: Validate target and runner exit policies on untouched holdouts
        if: ${{ steps.scan_window.outputs.stocks == 'true' && steps.scan_window.outputs.deep == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/validate-exit-policy.mjs

      - name: Build champion challenger governance
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/build-champion-challenger.mjs

      - name: Optimize growth plan with target2 reward-risk and cost-adjusted expectancy
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/optimize-growth-plan.mjs

      - name: Enforce no model-only live size increases
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/enforce-model-sizing-lock.mjs

      - name: Apply holdout-regime and event-risk guards
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/apply-advanced-growth-guards.mjs

      - name: Expand across multiple high-quality stock opportunities
        if: ${{ steps.scan_window.outputs.stocks == 'true' }}
        run: node scripts/apply-opportunity-expansion.mjs

      - name: Update accepted/rejected shadow ledger
        if: ${{ steps.scan_window.outputs.stocks == 'true' && steps.scan_window.outputs.deep == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/update-shadow-ledger.mjs

      - name: Generate fresh crypto plan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/generate-crypto-picks.mjs

      - name: Apply probability-first stock options crypto overlay
        run: node scripts/apply-probability-first-guards.mjs

      - name: Rank qualified opportunities across asset classes
        run: node scripts/build-cross-asset-opportunity-ranking.mjs

      - name: Build, protect, govern and validate signal
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/signal.json ]; then cp docs/signal.json /tmp/teststock-last-good-signal.json; fi
          if node scripts/build-agent-signal.mjs && node scripts/augment-signal-safety.mjs && node scripts/apply-fractional-protection-policy.mjs && node scripts/apply-exit-policy-validation.mjs && node scripts/apply-strategy-intelligence.mjs && node scripts/apply-operational-safety.mjs && node scripts/validate-signal.mjs docs/signal.json; then
            echo "Fresh signal passed validation"
          else
            echo "Fresh signal failed generation or validation. Refusing to publish mixed-generation data." >&2
            if [ -f /tmp/teststock-last-good-signal.json ]; then cp /tmp/teststock-last-good-signal.json docs/signal.json; fi
            exit 1
          fi

      - name: Publish refreshed JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/signal.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh static Teststock picks"
            git pull --rebase origin main
            git push
          fi
