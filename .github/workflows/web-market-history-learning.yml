name: Learn from broad web market history

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/build-web-market-history-learning.mjs'
      - '.github/workflows/web-market-history-learning.yml'

permissions:
  contents: write

concurrency:
  group: static-scan
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Learn from broad US stock history
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TESTSTOCK_HISTORY_YEARS: '10'
        run: node scripts/build-web-market-history-learning.mjs
      - name: Publish historical market priors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/web-market-history-learning.json
          if git diff --cached --quiet; then
            echo "No web-history changes."
          else
            git commit -m "Refresh broad web market history learning"
            git pull --rebase -X theirs origin main
            git push
          fi
