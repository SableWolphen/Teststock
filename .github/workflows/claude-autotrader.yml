name: Claude Teststock executor fallback

# Manual/emergency fallback only. Normal live execution now happens inside the
# persistent self-hosted intraday runner so stale queued jobs cannot accumulate.
on:
  workflow_dispatch:

concurrency:
  group: claude-teststock-executor-fallback
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    runs-on: [self-hosted, teststock-trader]
    timeout-minutes: 5
    steps:
      - name: Checkout latest Teststock main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify constrained execution runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v claude >/dev/null
          test -f .mcp.json
          test -f scripts/claude-executor-prompt.md
          test -f docs/signal.json
          test -f docs/data/execution-dispatch.json
          test -f docs/data/trigger-board.json
          test -f docs/data/execution-watchlist.json

      - name: Run one reconciled Claude execution cycle
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          output_path="$(mktemp /tmp/teststock-claude-fallback.XXXXXX.json)"
          trap 'rm -f "$output_path"' EXIT
          claude -p "$(cat scripts/claude-executor-prompt.md)" \
            --mcp-config .mcp.json \
            --allowedTools "Read,Glob,Grep,mcp__robinhood-trading" \
            --max-turns 16 \
            --output-format json \
            > "$output_path"
          python - "$output_path" <<'PY'
          import json,sys
          with open(sys.argv[1],'r',encoding='utf-8') as f:
              data=json.load(f)
          print('Claude fallback executor completed.')
          result=data.get('result') if isinstance(data,dict) else None
          if isinstance(result,str): print(result[:1000])
          PY
