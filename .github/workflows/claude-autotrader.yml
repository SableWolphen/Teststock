name: Claude Teststock executor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: claude-teststock-executor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    # A persistent self-hosted runner is required so Robinhood MCP OAuth can be
    # authenticated once with `claude mcp ...` / `/mcp` and securely refreshed
    # by Claude Code. Add the custom `teststock-trader` label only to that runner.
    runs-on: [self-hosted, teststock-trader]
    timeout-minutes: 4

    steps:
      - name: Checkout latest Teststock main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify constrained execution runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v claude >/dev/null
          test -f .mcp.json
          test -f scripts/claude-executor-prompt.md
          test -f docs/signal.json
          test -f docs/data/execution-dispatch.json
          test -f docs/data/crypto-tournament.json
          echo 'Claude runtime and Teststock execution inputs are present.'

      - name: Run Claude sole execution agent
        shell: bash
        env:
          # Optional on a self-hosted runner already authenticated to Claude.
          # If you prefer API billing, store ANTHROPIC_API_KEY as a GitHub
          # Actions secret; never commit it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          output_path="$(mktemp /tmp/teststock-claude-executor.XXXXXX.json)"
          trap 'rm -f "$output_path"' EXIT
          claude -p "$(cat scripts/claude-executor-prompt.md)" \
            --mcp-config .mcp.json \
            --allowedTools "Read,Glob,Grep,mcp__robinhood-trading" \
            --max-turns 16 \
            --output-format json \
            > "$output_path"

          python - "$output_path" <<'PY'
          import json, sys
          p=sys.argv[1]
          with open(p,'r',encoding='utf-8') as f:
              data=json.load(f)
          # Keep logs intentionally small; never print MCP payloads/account data.
          result=data.get('result') if isinstance(data,dict) else None
          print('Claude executor completed.')
          if isinstance(result,str):
              print(result[:1000])
          PY
