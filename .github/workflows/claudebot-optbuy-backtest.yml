name: ClaudeBot call-buying-on-dips backtest (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['claudebot/optbuy_backtest.py', '.github/workflows/claudebot-scalp-backtest.yml']
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/optbuy_backtest.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-optbuy-backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot call-buying backtest results (research only)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
