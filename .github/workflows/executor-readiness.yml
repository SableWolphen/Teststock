name: Verify execution readiness (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/executor-readiness.yml'
      - 'scripts/check-execution-readiness.mjs'
      - 'scripts/reconcile-broker-state.mjs'
permissions:
  contents: write
concurrency:
  group: executor-readiness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify OpenAI and Robinhood without orders
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ROBINHOOD_MCP_OAUTH_TOKEN: ${{ secrets.ROBINHOOD_MCP_OAUTH_TOKEN }}
          TESTSTOCK_EXECUTION_MODE: ${{ vars.TESTSTOCK_EXECUTION_MODE || 'paper' }}
          TESTSTOCK_LIVE_TRADING: ${{ vars.TESTSTOCK_LIVE_TRADING || 'false' }}
        run: node scripts/check-execution-readiness.mjs
      - name: Publish credential-free readiness result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/executor-readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish read-only execution readiness'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1
