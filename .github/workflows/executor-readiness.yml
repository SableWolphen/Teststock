name: Publish execution routing (no broker access)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/executor-readiness.yml'
      - 'scripts/check-execution-readiness.mjs'
permissions:
  contents: write
concurrency:
  group: executor-readiness
  cancel-in-progress: false
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record ChatGPT as the execution owner
        run: node scripts/check-execution-readiness.mjs
      - name: Publish execution routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/executor-readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish ChatGPT-connected execution routing'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1
