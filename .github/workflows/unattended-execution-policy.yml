name: Apply Teststock unattended execution policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-claude-unattended-execution-policy.mjs'
      - 'scripts/validate-unattended-execution-policy.mjs'
      - '.github/workflows/unattended-execution-policy.yml'
  workflow_run:
    workflows: ['Refresh Teststock picks']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: unattended-execution-policy
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply unattended execution policy
        run: node scripts/apply-claude-unattended-execution-policy.mjs

      - name: Validate unattended execution policy
        run: node scripts/validate-unattended-execution-policy.mjs

      - name: Publish policy-enforced signal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/signal.json docs/data/claude-signal.json
          if git diff --cached --quiet; then
            echo "Unattended execution policy already current"
          else
            git commit -m "Apply unattended Teststock execution policy"
            git pull --rebase origin main
            git push
          fi
