name: Teststock crypto cross-check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Refresh Teststock picks']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: teststock-crypto-cross-check
  cancel-in-progress: false

jobs:
  crypto:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED: ${{ secrets.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED }}
      # Claude is the sole broker execution agent. GitHub may research, monitor and
      # publish Robinhood cross-check state, but this workflow must never submit orders.
      ROBINHOOD_CRYPTO_DRY_RUN: 'true'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        if: ${{ env.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Robinhood Crypto API dependencies
        if: ${{ env.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED == 'true' }}
        run: pip install --disable-pip-version-check requests pynacl

      - name: Apply lot-aware crypto ownership patch
        if: ${{ env.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED == 'true' }}
        run: node scripts/apply-crypto-dust-reconciliation.mjs

      - name: Run read-only Robinhood crypto cross-check
        if: ${{ env.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED == 'true' }}
        env:
          ROBINHOOD_CRYPTO_API_KEY: ${{ secrets.ROBINHOOD_CRYPTO_API_KEY }}
          ROBINHOOD_CRYPTO_PRIVATE_KEY_B64: ${{ secrets.ROBINHOOD_CRYPTO_PRIVATE_KEY_B64 }}
          ROBINHOOD_CRYPTO_ACCOUNT_NUMBER: ${{ secrets.ROBINHOOD_CRYPTO_ACCOUNT_NUMBER }}
          ROBINHOOD_CRYPTO_MAX_ORDER_USD: ${{ secrets.ROBINHOOD_CRYPTO_MAX_ORDER_USD }}
        run: python scripts/robinhood_crypto_autopilot.py

      - name: Restore runtime-only patched source
        if: ${{ always() && env.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED == 'true' }}
        run: git restore --worktree --staged scripts/robinhood_crypto_autopilot.py || true

      - name: Publish only non-sensitive cross-check state
        if: ${{ always() && env.ROBINHOOD_CRYPTO_AUTOPILOT_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/execution-watchlist.json docs/data/crypto-api-status.json docs/data/crypto-robinhood-cross-check.json || true
          if git diff --cached --quiet; then
            echo "No public crypto state changes"
          else
            git commit -m "Update crypto cross-check state"
            git pull --rebase -X theirs origin main
            git push
          fi
