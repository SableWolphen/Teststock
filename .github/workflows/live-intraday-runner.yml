name: Live Teststock intraday runner

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify runner startup without invoking the trading loop or broker tools'
        type: boolean
        default: false
  schedule:
    # Weekday regular-session wake only (UTC window spans EDT/EST); an in-job NYSE gate below is authoritative.
    - cron: '2 13-21 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-intraday-runner.yml'
      - 'scripts/run-live-intraday-cycle.sh'
      - 'scripts/run-background-learning.sh'
      - 'scripts/build-daytrader-intelligence.mjs'
      - 'scripts/validate-daytrader-intelligence.mjs'
      - 'scripts/build-real-fill-scorecard.mjs'
      - 'scripts/build-trade-quality-engine.mjs'
      - 'scripts/apply-model-drift.mjs'
      - 'scripts/validate-trade-quality-engine.mjs'
      - 'scripts/build-live-trading-health.mjs'
      - 'scripts/runner-health.mjs'
      - 'scripts/write-runner-heartbeat.mjs'
      - 'scripts/verify-runtime-prerequisites.mjs'
      - 'scripts/check-alpaca-market-session.mjs'
      - 'scripts/chatgpt-trade-quality-rules.md'
      - 'scripts/chatgpt-stock-rotation-rules.md'
      - 'scripts/daytrader-profit-discipline.md'
      - 'scripts/test-trade-quality-resilience.mjs'
      - 'scripts/update-trigger-board.mjs'
      - 'scripts/enforce-day-trader-trigger-policy.mjs'
      - 'scripts/apply-intraday-edge-overlay.mjs'
      - 'scripts/rebuild-intraday-trigger-state.mjs'
      - 'scripts/validate-intraday-edge-overlay.mjs'
      - 'scripts/build-execution-dispatch.mjs'
      - 'scripts/validate-execution-dispatch.mjs'
      - 'scripts/dispatch-needed.mjs'
      - 'scripts/reconcile-broker-state.mjs'
      - 'scripts/broker-state.mjs'
      - 'scripts/chain-live-session.mjs'
      - 'scripts/chatgpt-executor.mjs'
      - 'scripts/chatgpt-executor-prompt.md'
      - 'scripts/validate-options-policy.mjs'
      - 'scripts/options-monitor-candidates.mjs'
      - 'scripts/chatgpt-options-rules.md'
      - 'docs/data/trade-replay.json'
      - '.openai-mcp.json'

concurrency:
  group: live-teststock-intraday-runner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  live:
    runs-on: [self-hosted, teststock-trader]
    timeout-minutes: 58
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify persistent trading runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_bin="$RUNNER_TEMP/teststock-command-shims"
          mkdir -p "$runtime_bin"
          if ! command -v python >/dev/null && command -v powershell.exe >/dev/null; then
            py_launcher=$(powershell.exe -NoProfile -Command "(Get-Command py.exe -ErrorAction SilentlyContinue).Source" | tr -d '\r' | tail -n 1)
            if [ -n "$py_launcher" ]; then
              py_launcher_posix=$(cygpath -u "$py_launcher")
              printf '#!/usr/bin/env bash\nexec "%s" -3 "$@"\n' "$py_launcher_posix" > "$runtime_bin/python"
              chmod +x "$runtime_bin/python"
              export PATH="$runtime_bin:$PATH"
              echo "$runtime_bin" >> "$GITHUB_PATH"
              echo "Recovered Python from the Windows Python launcher."
            else
              python_path=$(powershell.exe -NoProfile -Command "(Get-Command python.exe -ErrorAction SilentlyContinue).Source" | tr -d '\r' | tail -n 1)
              if [ -n "$python_path" ]; then
                python_dir=$(dirname "$(cygpath -u "$python_path")")
                export PATH="$python_dir:$PATH"
                echo "$python_dir" >> "$GITHUB_PATH"
                echo "Recovered Python from Windows command discovery."
              fi
            fi
          fi
          for executable in node python; do
            if ! command -v "$executable" >/dev/null; then
              echo "::error::Runtime prerequisite failed: executable '$executable' is not on PATH"
              exit 1
            fi
            echo "Runtime executable found: $executable=$(command -v "$executable")"
          done
          python --version
          TESTSTOCK_EXECUTION_MODE=paper node scripts/verify-runtime-prerequisites.mjs
          # Unit/regression tests run in Build Check; startup verification must only
          # gate on runtime prerequisites so a test failure cannot kill live sessions.
          echo 'Persistent Teststock trading and independent background-learning lanes are present.'

      - name: Check regular US stock session
        id: stock_session
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -euo pipefail
          session_open=false
          if value=$(node scripts/check-alpaca-market-session.mjs); then
            session_open="$value"
          else
            echo "::warning::Authoritative Alpaca market-clock check failed; failing closed for new stock/options execution."
          fi
          echo "open=$session_open" >> "$GITHUB_OUTPUT"
          if [ "$session_open" = "true" ]; then
            echo "Alpaca confirms the regular US stock session is active."
          else
            echo "Regular US stock session is closed or unverified; skipping stock/options live runner."
          fi

      - name: Run concurrent trading and learning lanes
        if: ${{ !inputs.verify_only && steps.stock_session.outputs.open == 'true' }}
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ROBINHOOD_MCP_OAUTH_TOKEN: ${{ secrets.ROBINHOOD_MCP_OAUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
          TESTSTOCK_LEARNING_INTERVAL_SECONDS: 300
          GH_TOKEN: ${{ github.token }}
          TESTSTOCK_RUNNER_HEARTBEAT_FILE: ${{ runner.temp }}/teststock-runtime/runner-heartbeat.json
        run: |
          set -euo pipefail
          node scripts/write-runner-heartbeat.mjs "$TESTSTOCK_RUNNER_HEARTBEAT_FILE"
          bash scripts/run-background-learning.sh &
          learner_pid=$!
          cleanup() {
            kill "$learner_pid" 2>/dev/null || true
            wait "$learner_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          end=$(( $(date +%s) + 3300 ))
          cycle=0
          consecutive_cycle_failures=0
          while [ "$(date +%s)" -lt "$end" ]; do
            cycle=$((cycle+1))
            started=$(date +%s)
            echo "=== Teststock fast intraday cycle $cycle at $(date -u +%FT%TZ) ==="
            node scripts/write-runner-heartbeat.mjs "$TESTSTOCK_RUNNER_HEARTBEAT_FILE"
            if ! git fetch --quiet origin main; then
              echo "git fetch failed this cycle (likely transient network); reusing current checkout"
            elif ! git reset --hard --quiet origin/main; then
              echo "git reset failed this cycle (likely transient network); reusing current checkout"
            fi

            if TESTSTOCK_EXECUTION_MODE=paper bash scripts/run-live-intraday-cycle.sh; then
              consecutive_cycle_failures=0
            else
              rc=1
              consecutive_cycle_failures=$((consecutive_cycle_failures+1))
              echo "::warning::Fast intraday cycle failed with exit code ${rc}; keeping the live session alive so the next gated cycle can recover safely."
              echo "No blind broker retry is performed; the executor's next eligible wake must re-read broker state and reconcile first."
              if [ "$consecutive_cycle_failures" -ge 3 ]; then
                echo "::error::Three consecutive fast-cycle failures occurred. Stopping this session so the watchdog can launch a clean recovery run."
                exit "$rc"
              fi
            fi

            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -lt 45 ]; then sleep $((45-elapsed)); fi
          done
          echo "Live intraday session completed; background learner stopped cleanly."

          # Never self-chain after the authoritative Alpaca market clock says the
          # regular session has closed. Do not use TZ=... date here: the self-hosted
          # Windows Git-Bash runner can ignore IANA TZ names and misclassify an open
          # market as closed.
          session_open=false
          if value=$(node scripts/check-alpaca-market-session.mjs); then
            session_open="$value"
          else
            echo "::warning::Could not verify Alpaca market clock at self-chain boundary; failing closed."
          fi
          if [ "$session_open" != "true" ]; then
            echo "Regular US stock session is closed or unverified; ending runner without self-chain."
            exit 0
          fi

          # Self-chain the next session instead of relying solely on the hourly cron
          # schedule event or the 5-minute watchdog to notice and recover. Both are
          # GitHub-scheduled triggers and both were observed going silent for hours
          # at a time (2026-09-15, ~13:18-15:02 and ~11:09-15:01 ET respectively) --
          # a documented GitHub Actions platform behavior (scheduled workflow
          # delivery can be delayed or dropped under load), not something this repo's
          # workflow config can fully prevent. A direct workflow_dispatch API call
          # here does not depend on that delivery path, so as long as one session
          # ever completes cleanly, the chain is self-sustaining; cron and the
          # watchdog remain as the recovery path only for the case this step itself
          # cannot run (crash, timeout, or the self-hosted runner going offline).
          # This run's own databaseId (GITHUB_RUN_ID) must be excluded below: this
          # job is itself still "in_progress" from the API's point of view while
          # this very step executes, so an unfiltered queued/in_progress check
          # always matches itself and silently skips dispatching every time (the
          # same bug confirmed live in schedule-watchdog.yml's identical pattern
          # on 2026-09-17 -- fixed there too).
          node scripts/chain-live-session.mjs || echo "::warning::Self-chain failed; watchdog recovery remains available"
