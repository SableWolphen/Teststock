name: Live Teststock intraday runner

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify runner startup without invoking the trading loop or broker tools'
        type: boolean
        default: false
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-intraday-runner.yml'
      - 'scripts/run-live-intraday-cycle.sh'
      - 'scripts/run-background-learning.sh'
      - 'scripts/build-daytrader-intelligence.mjs'
      - 'scripts/validate-daytrader-intelligence.mjs'
      - 'scripts/build-real-fill-scorecard.mjs'
      - 'scripts/build-trade-quality-engine.mjs'
      - 'scripts/apply-model-drift.mjs'
      - 'scripts/validate-trade-quality-engine.mjs'
      - 'scripts/build-live-trading-health.mjs'
      - 'scripts/claude-trade-quality-rules.md'
      - 'scripts/claude-stock-rotation-rules.md'
      - 'scripts/daytrader-profit-discipline.md'
      - 'scripts/test-trade-quality-resilience.mjs'
      - 'scripts/update-trigger-board.mjs'
      - 'scripts/enforce-day-trader-trigger-policy.mjs'
      - 'scripts/apply-intraday-edge-overlay.mjs'
      - 'scripts/rebuild-intraday-trigger-state.mjs'
      - 'scripts/validate-intraday-edge-overlay.mjs'
      - 'scripts/build-execution-dispatch.mjs'
      - 'scripts/claude-executor-prompt.md'
      - 'docs/data/trade-replay.json'
      - '.mcp.json'

concurrency:
  group: live-teststock-intraday-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: [self-hosted, teststock-trader]
    timeout-minutes: 58
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify persistent trading runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null
          command -v python >/dev/null
          command -v claude >/dev/null
          test -f .mcp.json
          test -f scripts/run-live-intraday-cycle.sh
          test -f scripts/run-background-learning.sh
          test -f scripts/build-daytrader-intelligence.mjs
          test -f scripts/validate-daytrader-intelligence.mjs
          test -f scripts/build-real-fill-scorecard.mjs
          test -f scripts/build-trade-quality-engine.mjs
          test -f scripts/apply-model-drift.mjs
          test -f scripts/validate-trade-quality-engine.mjs
          test -f scripts/build-live-trading-health.mjs
          test -f scripts/claude-trade-quality-rules.md
          test -f scripts/claude-stock-rotation-rules.md
          test -f scripts/daytrader-profit-discipline.md
          test -f scripts/claude-executor-prompt.md
          grep -q 'learning-output' scripts/run-live-intraday-cycle.sh
          grep -q 'BACKGROUND_LEARNING_REFRESHED' scripts/run-background-learning.sh
          grep -q 'real-fill-scorecard.json' scripts/claude-trade-quality-rules.md
          grep -q 'daytrader-profit-discipline.md' scripts/run-live-intraday-cycle.sh
          grep -q 'OPEN_DRIVE' scripts/daytrader-profit-discipline.md
          grep -q 'MIDDAY' scripts/daytrader-profit-discipline.md
          grep -q 'POWER_HOUR' scripts/daytrader-profit-discipline.md
          node --test scripts/test-trade-quality-resilience.mjs scripts/test-runtime-diagnostics.mjs
          python scripts/test_executor_usage_gate.py
          echo 'Persistent Teststock trading and independent background-learning lanes are present.'

      - name: Verify Claude authentication without broker tools
        if: ${{ inputs.verify_only }}
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.teststock-runtime/executor-diagnostics"
          probe_dir="$(mktemp -d "$HOME/.teststock-runtime/executor-diagnostics/probe.XXXXXX")"
          probe_status=0
          claude -p "Reply with READY only. Do not take any actions." \
            --tools "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
            --no-session-persistence --max-turns 1 --output-format json \
            > "$probe_dir/stdout.json" 2> "$probe_dir/stderr.txt" || probe_status=$?
          python scripts/record-executor-result.py "$probe_dir" "$probe_status"

      - name: Run concurrent trading and learning lanes
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
          TESTSTOCK_LEARNING_INTERVAL_SECONDS: 300
        run: |
          set -euo pipefail
          bash scripts/run-background-learning.sh &
          learner_pid=$!
          cleanup() {
            kill "$learner_pid" 2>/dev/null || true
            wait "$learner_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          end=$(( $(date +%s) + 3300 ))
          cycle=0
          while [ "$(date +%s)" -lt "$end" ]; do
            cycle=$((cycle+1))
            started=$(date +%s)
            echo "=== Teststock fast intraday cycle $cycle at $(date -u +%FT%TZ) ==="
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            bash scripts/run-live-intraday-cycle.sh
            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -lt 45 ]; then sleep $((45-elapsed)); fi
          done
          echo "Live intraday session completed; background learner stopped cleanly and next queued session takes over."
