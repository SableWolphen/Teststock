name: ClaudeBot crypto signal
# Hourly: pull public candles, score setups, backtest the rule, publish
# docs/data/claudebot-signal.json. Places no orders and touches no account data.

on:
  schedule:
    - cron: '4 * * * *'
    - cron: '34 * * * *'   # second slot: GitHub drops many scheduled runs on busy repos
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'claudebot/signal.py'
      - 'claudebot/config.json'
      - '.github/workflows/claudebot-signal.yml'

permissions:
  contents: write

concurrency:
  group: claudebot-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build signal
        run: python claudebot/signal.py
      - name: Crypto paper desk (24/7, paper only)
        run: python claudebot/crypto_paper.py
        continue-on-error: true
      - name: Commit signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-signal.json docs/data/claudebot-crypto-paper.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot signal $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
