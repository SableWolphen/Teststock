name: ClaudeBot trade review data
on:
  workflow_dispatch:
  schedule:
    - cron: '37 21 * * 1-5'   # after the close, weekdays
  push:
    branches: [main]
    paths: ['claudebot/review_build.py', '.github/workflows/claudebot-review.yml',
            'docs/data/claudebot-dip-ledger.json', 'docs/data/claudebot-optbuy-ledger.json', 'docs/data/claudebot-options-ledger.json']
permissions:
  contents: write
concurrency: { group: claudebot-review, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/review_build.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-review.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot trade review data"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
