name: ClaudeBot trade gate
# Every 15 min in US market hours (free, no Claude usage): replay the live Dip desk rules on fresh
# prices and publish docs/data/claudebot-gate.json. Claude trader runs only do work when it says so.
on:
  workflow_dispatch:
    inputs:
      test_now: { description: 'Test mode: pretend it is this UTC time (nothing is written)', required: false, default: '' }
  schedule:
    - cron: '*/15 13-21 * * 1-5'
concurrency: { group: claudebot-gate, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/gate.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          GATE_TEST_NOW: ${{ github.event.inputs.test_now }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-gate.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot gate $(date -u +%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
