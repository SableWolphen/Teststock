name: ClaudeBot trade gate
# Every 5 min in US market hours (free, no Claude usage): replay the live Dip desk rules on fresh
# prices and publish docs/data/claudebot-gate.json. When a trade is ready it calls the Claude trading task
# right away (secrets ROUTINE_FIRE_URL / ROUTINE_FIRE_TOKEN); scheduled Claude runs remain the backup.
on:
  workflow_dispatch:
    inputs:
      test_now: { description: 'Test mode: pretend it is this UTC time (nothing is written)', required: false, default: '' }
      optscalp_test: { description: 'Options paper desk test: hours back to scan (nothing written)', required: false, default: '' }
  schedule:
    - cron: '*/5 13-21 * * 1-5'   # every 5 min (GitHub's fastest) through US market hours
concurrency: { group: claudebot-gate, cancel-in-progress: false }
permissions:
  contents: write
  issues: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/gate.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          GATE_TEST_NOW: ${{ github.event.inputs.test_now }}
      - name: Options quick-profit paper desk (paper only)
        if: ${{ github.event.inputs.test_now == '' || github.event.inputs.test_now == null }}
        run: python claudebot/hr.py active vega && python claudebot/optscalp_paper.py || true
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          OPTSCALP_TEST: ${{ github.event.inputs.optscalp_test }}
      - name: Publish independent-options evidence scorecard
        run: python claudebot/decision_scorecard.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-gate.json docs/data/claudebot-optscalp-paper.json docs/data/claudebot-decision-scorecard.json 2>/dev/null || git add docs/data/claudebot-gate.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot gate $(date -u +%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
      - name: Alert the owner when a held position hits its stop
        # Robinhood refuses stop orders on fractional shares, so the bot's stops live in its Claude runs.
        # If those runs are not working (for example the usage limit was reached), this GitHub alert still
        # reaches the owner. One open alert per position; it never trades.
        if: ${{ github.event.inputs.test_now == '' || github.event.inputs.test_now == null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(jq '(.stopAlerts // []) | length' docs/data/claudebot-gate.json); [ "$n" -gt 0 ] || { echo "no stop hit"; exit 0; }
          gh label create stop-alert --color B60205 --description "A held position reached its stop price" 2>/dev/null || true
          jq -c '.stopAlerts[]' docs/data/claudebot-gate.json | while read -r a; do
            sym=$(echo "$a" | jq -r .symbol); stop=$(echo "$a" | jq -r .stopPrice); last=$(echo "$a" | jq -r .lastPrice); entry=$(echo "$a" | jq -r .entryPrice)
            title="Sell $sym now: it hit its stop (\$$stop)"
            if gh issue list --label stop-alert --state open --search "in:title \"Sell $sym now\"" --json number --jq 'length' | grep -qv '^0$'; then echo "alert already open for $sym"; continue; fi
            body="@${{ github.repository_owner }} $sym is at \$$last, at or below its stop of \$$stop (bought at \$$entry).

          The bot's Claude run is meant to sell it right away. If you have not had a message saying it sold, open the Robinhood app and sell your $sym in the MCP account.

          Robinhood does not accept stop orders on fractional shares, so this alert is the backup. Close this issue once it is sold. Checked $(date -u +'%H:%M UTC')."
            gh issue create --title "$title" --label stop-alert --body "$body" && echo "alert sent for $sym"
          done
      - name: Call Claude when a trade is ready
        if: ${{ github.event.inputs.test_now == '' || github.event.inputs.test_now == null }}
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          [ "$(jq -r '.callClaude // false' docs/data/claudebot-gate.json)" = "true" ] || { echo "nothing to buy or sell"; exit 0; }
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then echo "::warning::trade ready but call secrets are not set; the next scheduled Claude run will act"; exit 0; fi
          why=$(jq -c '.reasons' docs/data/claudebot-gate.json)
          body=$(jq -n --arg t "GitHub trade gate: a trade looks ready. Reasons: $why. Do the full run now (the gate file says needed=true)." '{text:$t}')
          code=$(curl -sS -o /tmp/fire.json -w '%{http_code}' -X POST "$ROUTINE_FIRE_URL" -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" -H "anthropic-version: 2026-10-21" -H "Content-Type: application/json" -d "$body")
          echo "call status $code"; [ "$code" = "200" ] || { echo "::warning::Claude call failed ($code); the next scheduled run will act"; cat /tmp/fire.json | jq -r '.error.type // empty'; }
