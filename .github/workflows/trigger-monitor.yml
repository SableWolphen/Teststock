name: Monitor Teststock triggers

on:
  workflow_dispatch:
  schedule:
    # Offset from the five-minute Claude executor so it normally sees a trigger
    # board refreshed a couple of minutes earlier.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-trigger-board.mjs'
      - 'scripts/nyse-session.mjs'
      - 'scripts/test-nyse-session.mjs'
      - 'scripts/test-day-trade-dispatch.mjs'
      - 'scripts/build-execution-dispatch.mjs'
      - 'scripts/validate-execution-dispatch.mjs'
      - 'scripts/validate-trigger-board.mjs'
      - 'docs/data/execution-watchlist.json'
      - 'docs/signal.json'
      - 'docs/data/growth-plan-*.json'
      - 'docs/data/crypto-plan-*.json'
      - '.github/workflows/trigger-monitor.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: trigger-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test market-session safety logic
        run: node --test scripts/test-*.mjs

      - name: Self-heal stale stock research during the regular session
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A stale candidate is never tradable as-is. During the regular US
          # stock session, request a fresh full scan so the candidate gets
          # rebuilt from current data and can be re-evaluated from scratch.
          dow=$(TZ=America/New_York date +%u)
          hour=$(TZ=America/New_York date +%H)
          minute=$(TZ=America/New_York date +%M)
          minute_of_day=$((10#$hour * 60 + 10#$minute))

          if [ "$dow" -lt 1 ] || [ "$dow" -gt 5 ] || [ "$minute_of_day" -lt 570 ] || [ "$minute_of_day" -ge 960 ]; then
            echo "Outside regular US stock session; no stale-stock refresh request needed."
            exit 0
          fi

          if ! jq -e '
            [
              (.stockPlan.stockCandidateQueue // [])[],
              (.stockPlan.stockOrders // [])[]
            ]
            | any(.action == "STALE_DO_NOT_TRADE")
          ' docs/signal.json >/dev/null; then
            echo "No stale stock candidates found."
            exit 0
          fi

          echo "Stale stock research detected during the regular session."

          if gh run list --workflow static-scan.yml --limit 20 --json status \
            | jq -e 'any(.[]; .status == "queued" or .status == "in_progress")' >/dev/null; then
            echo "A Refresh Teststock picks run is already queued or in progress; not duplicating it."
            exit 0
          fi

          gh workflow run static-scan.yml --ref main
          echo "Requested a fresh full Teststock scan. The stale candidate remains blocked until the refreshed generation passes every gate."

      - name: Detect entry stop and profit triggers without an LLM
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/update-trigger-board.mjs

      - name: Validate trigger board fail closed
        run: node scripts/validate-trigger-board.mjs

      - name: Build compact automatic execution packet
        run: node scripts/build-execution-dispatch.mjs

      - name: Validate execution packet and fail closed
        run: node scripts/validate-execution-dispatch.mjs

      - name: Publish trigger and execution state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trigger-board.json docs/data/execution-dispatch.json
          if git diff --cached --quiet; then
            echo "No trigger-state change to publish"
          else
            git commit -m "Update Teststock trigger and automatic execution dispatch"
            git pull --rebase -X theirs origin main
            git push
          fi
