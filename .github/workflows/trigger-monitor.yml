name: Monitor Teststock triggers

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-trigger-board.mjs'
      - 'scripts/build-execution-dispatch.mjs'
      - 'scripts/validate-trigger-board.mjs'
      - 'docs/data/execution-watchlist.json'
      - '.github/workflows/trigger-monitor.yml'

permissions:
  contents: write

concurrency:
  group: trigger-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect entry stop and profit triggers without an LLM
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/update-trigger-board.mjs

      - name: Validate trigger board fail closed
        run: node scripts/validate-trigger-board.mjs

      - name: Build one compact prioritized execution packet
        run: node scripts/build-execution-dispatch.mjs

      - name: Publish trigger and execution state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trigger-board.json docs/data/execution-dispatch.json
          if git diff --cached --quiet; then
            echo "No trigger-state change to publish"
          else
            git commit -m "Update Teststock trigger and execution dispatch"
            git pull --rebase origin main
            git push
          fi
