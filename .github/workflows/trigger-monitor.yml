name: Monitor Teststock triggers

on:
  workflow_dispatch:
  schedule:
    # Refresh live entry/exit conditions every five minutes, offset from ChatGPT.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-trigger-board.mjs'
      - 'scripts/normalize-trigger-board-policy.mjs'
      - 'scripts/enforce-day-trader-trigger-policy.mjs'
      - 'scripts/apply-intraday-edge-overlay.mjs'
      - 'scripts/rebuild-intraday-trigger-state.mjs'
      - 'scripts/validate-intraday-edge-overlay.mjs'
      - 'scripts/crypto-monitor-candidates.mjs'
      - 'scripts/test-crypto-monitoring.mjs'
      - 'scripts/nyse-session.mjs'
      - 'scripts/test-nyse-session.mjs'
      - 'scripts/test-day-trade-dispatch.mjs'
      - 'scripts/build-execution-dispatch.mjs'
      - 'scripts/validate-execution-dispatch.mjs'
      - 'scripts/validate-trigger-board.mjs'
      - 'docs/data/execution-watchlist.json'
      - 'docs/data/adaptive-performance.json'
      - 'docs/signal.json'
      - 'docs/data/growth-plan-*.json'
      - 'docs/data/crypto-plan-*.json'
      - '.github/workflows/trigger-monitor.yml'

permissions:
  contents: write
  actions: write

concurrency:
  # Alpaca Basic is capped at 200 market-data requests/minute. Serialize live
  # research publishers so trigger, fast refresh and full scan cannot burst together.
  group: static-scan
  # Do not cancel a nearly-finished refresh just because the next 5-minute tick arrived.
  # Finishing one coherent generation is safer than repeatedly starving publication.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test market-session safety logic
        run: node --test scripts/test-nyse-session.mjs scripts/test-day-trade-dispatch.mjs

      - name: Verify authoritative NYSE session
        id: market_window
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/write-nyse-session-output.mjs "$GITHUB_OUTPUT"

      - name: Self-heal stale stock research during the regular session
        if: steps.market_window.outputs.stocks == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dow=$(TZ=America/New_York date +%u)
          hour=$(TZ=America/New_York date +%H)
          minute=$(TZ=America/New_York date +%M)
          minute_of_day=$((10#$hour * 60 + 10#$minute))

          if [ "$dow" -lt 1 ] || [ "$dow" -gt 5 ] || [ "$minute_of_day" -lt 570 ] || [ "$minute_of_day" -ge 960 ]; then
            echo "Outside regular US stock session; no stale-stock refresh request needed."
          elif ! jq -e '
            [(.stockPlan.stockCandidateQueue // [])[],(.stockPlan.stockOrders // [])[]]
            | any(.action == "STALE_DO_NOT_TRADE")
          ' docs/signal.json >/dev/null; then
            echo "No stale stock candidates found."
          elif gh run list --workflow static-scan.yml --limit 20 --json status \
            | jq -e 'any(.[]; .status == "queued" or .status == "in_progress")' >/dev/null; then
            echo "A Refresh Teststock picks run is already queued or in progress."
          else
            gh workflow run static-scan.yml --ref main
            echo "Requested a fresh full Teststock scan; stale candidates remain blocked meanwhile."
          fi

      - name: Detect entry stop and profit triggers without an LLM
        if: steps.market_window.outputs.stocks == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/update-trigger-board.mjs

      - name: Normalize authoritative stock sizing and timing policy
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/normalize-trigger-board-policy.mjs

      - name: Enforce day-trader session and flattening policy
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/enforce-day-trader-trigger-policy.mjs

      - name: Refresh 1m and 5m intraday edge
        if: steps.market_window.outputs.stocks == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/apply-intraday-edge-overlay.mjs

      - name: Rebuild ranked trigger competition after intraday filtering
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/rebuild-intraday-trigger-state.mjs

      - name: Validate intraday edge fail closed
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/validate-intraday-edge-overlay.mjs

      - name: Validate trigger board fail closed
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/validate-trigger-board.mjs

      - name: Build compact automatic execution packet
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/build-execution-dispatch.mjs

      - name: Validate execution packet and fail closed
        if: steps.market_window.outputs.stocks == 'true'
        run: node scripts/validate-execution-dispatch.mjs

      - name: Publish trigger and execution state
        if: steps.market_window.outputs.stocks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trigger-board.json docs/data/intraday-edge.json docs/data/execution-dispatch.json
          if git diff --cached --quiet; then
            echo "No trigger-state change to publish"
          else
            git commit -m "Update Teststock intraday edge and execution dispatch"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying transient GitHub failure..." >&2
              sleep $((attempt * 3))
            done
            echo "Unable to publish trigger state after 3 attempts." >&2
            exit 1
          fi

      - name: Wake live executor for actionable dispatch
        if: steps.market_window.outputs.stocks == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! jq -e '.chatgptShouldRun == true or .executionNeeded == true' docs/data/execution-dispatch.json >/dev/null; then
            echo "Dispatch is idle; no executor wake required."
            exit 0
          fi

          existing="$(gh run list --workflow live-intraday-runner.yml --limit 10 --json databaseId,status 2>/dev/null || echo '[]')"
          if echo "$existing" | jq -e 'any(.[]; .status == "queued" or .status == "in_progress")' >/dev/null 2>&1; then
            echo "Live Teststock executor is already queued/running; it will consume the actionable dispatch on its next fast cycle."
            exit 0
          fi

          gh workflow run live-intraday-runner.yml --ref main
          echo "Actionable dispatch published and live executor wake requested."
