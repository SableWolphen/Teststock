name: ClaudeBot market-wide paper lab
# After each close: replay the day-trade strategies on every watched stock (PAPER ONLY).
# Writes docs/data/claudebot-daytrade-wide.json. Places no orders and touches no account data.
on:
  schedule:
    - cron: '25 21 * * 1-5'
    - cron: '55 23 * * 1-5'   # backup slot: GitHub drops scheduled runs on busy repos
  workflow_dispatch:
    inputs:
      day: { description: 'YYYY-MM-DD to replay (default today)', required: false }
  push:
    branches: [main]
    paths: ['claudebot/daytrade_wide.py', '.github/workflows/claudebot-daytrade-wide.yml']
permissions:
  contents: write
concurrency:
  group: claudebot-daytrade-wide
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/daytrade_wide.py ${{ github.event.inputs.day }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-daytrade-wide.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot market-wide paper lab $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
