name: Refresh Teststock trade replay

on:
  workflow_dispatch:
  schedule:
    - cron: '8 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trade-replay.yml'
      - 'scripts/build-trade-replay.mjs'
      - 'scripts/validate-trade-replay.mjs'
      - 'docs/data/real-trade-journal.json'
      - 'docs/data/crypto-real-trade-journal.json'

permissions:
  contents: write

concurrency:
  group: teststock-trade-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate replay attribution
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -euo pipefail
          node scripts/build-trade-replay.mjs
          node scripts/validate-trade-replay.mjs
      - name: Publish replay snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trade-replay.json
          if git diff --cached --quiet; then
            echo 'No replay changes to publish.'
          else
            git commit -m 'Refresh Teststock post-trade replay'
            git pull --rebase -X theirs origin main
            git push
          fi
