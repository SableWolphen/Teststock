name: Learn intraday stock history

on:
  workflow_dispatch:
  schedule:
    - cron: '47 7 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/build-intraday-history-learning.mjs'
      - '.github/workflows/intraday-history-learning.yml'

permissions:
  contents: write

concurrency:
  group: static-scan
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build intraday learning
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TESTSTOCK_INTRADAY_DAYS: '90'
          TESTSTOCK_INTRADAY_SYMBOLS: '240'
        run: node scripts/build-intraday-history-learning.mjs
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/intraday-history-learning.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh intraday history learning"
            git pull --rebase -X theirs origin main
            git push
          fi
