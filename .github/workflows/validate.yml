name: Teststock validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test ClaudeBot trading planners and independent governor
        run: |
          python claudebot/test_dip_bot.py
          python claudebot/test_governor.py
          python claudebot/test_recovery.py
          python claudebot/test_edge_promote.py
          python claudebot/test_outlook.py
          python claudebot/test_options_report.py
          python claudebot/test_cheapcall_paper.py
          python claudebot/test_cheapstock_paper.py
          python claudebot/test_scoreboard.py
          python claudebot/test_audit.py
          python claudebot/test_gatekeeper.py
          python claudebot/test_optscalp_paper.py
          python claudebot/test_decision_scorecard.py
          python claudebot/test_tournament.py
          python claudebot/test_daily_profit.py
      - name: Test published dispatch safety
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
