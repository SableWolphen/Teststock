name: ClaudeBot research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['claudebot/research.py', '.github/workflows/claudebot-research.yml']
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python claudebot/research.py 4200
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/claudebot-research.json
          git diff --cached --quiet && exit 0
          git commit -m "ClaudeBot research results"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
