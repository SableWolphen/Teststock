name: Build check

on:
  push:
    branches: [main, openai-auto-executor]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test market-session safety logic
        run: npm test
      - name: Test executor usage throttling
        run: python scripts/test_executor_usage_gate.py
      - name: Build Vite app
        run: npm run build
