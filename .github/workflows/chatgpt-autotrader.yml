name: Publish ChatGPT execution handoff
# GitHub produces signals only. ChatGPT's connected Robinhood tools place orders.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report intelligence handoff status
        run: |
          needed=$(node scripts/dispatch-needed.mjs docs/data/execution-dispatch.json)
          echo "ChatGPT connected execution requested by packet: $needed"
          echo 'This workflow never invokes broker tools or places orders.'
