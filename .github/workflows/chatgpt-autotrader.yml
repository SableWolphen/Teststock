name: Publish ChatGPT execution handoff
# Signals only: connected Robinhood order actions require a separately authenticated
# user-facing ChatGPT session and a fresh per-order review.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dispatch and report execution handoff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-execution-dispatch.mjs
          needed=$(node scripts/dispatch-needed.mjs docs/data/execution-dispatch.json)
          echo "ChatGPT execution candidate requested by packet: $needed"
          {
            echo '## Teststock order handoff'
            echo ''
            echo "- Dispatch candidate: **$needed**"
            echo '- GitHub broker execution: **DISABLED**'
            echo '- ChatGPT connector access: **must be verified in the active session**'
            echo '- Robinhood order: **not submitted by this job**'
            echo ''
            echo 'Any candidate requires fresh broker state, cash buying power, market session,'
            echo 'order review, protective-exit capability, and explicit per-order authorization.'
            echo 'An approved order must be submitted through the connected broker tool,'
            echo 'then its receipt and resulting position must be reconciled.'
            echo 'Workflow success only proves the dispatch validator ran.'
          } >> "$GITHUB_STEP_SUMMARY"
