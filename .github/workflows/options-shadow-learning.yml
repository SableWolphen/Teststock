name: Options background learning

on:
  schedule:
    # Heavy option learning runs after the cash session to preserve live request budget.\n    - cron: '17 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-scan
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan broad stock option universe
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
        run: node scripts/scan-small-account-options.mjs

      - name: Update forward options shadow ledger
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
        run: node scripts/update-options-shadow-ledger.mjs

      - name: Replay historical option contracts
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_OPTIONS_FEED: indicative
        run: node scripts/replay-options-history.mjs

      - name: Update options evidence state
        run: node scripts/apply-options-profitability-admission.mjs

      - name: Validate options policy
        run: node scripts/validate-options-policy.mjs

      - name: Commit learning artifacts
        run: |
          set -euo pipefail
          git config user.name "teststock-options-learner"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/small-account-options.json docs/data/options-shadow-trades.json docs/data/options-historical-replay.json docs/data/options-profitability-admission.json
          git diff --cached --quiet || git commit -m "Update background stock-options learning"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Options learning push raced with another publisher; retrying ($attempt/4)."
            sleep 2
          done
          echo "::error::Could not publish options learning artifacts after four rebases."
          exit 1
