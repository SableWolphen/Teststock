name: Teststock scheduling watchdog

# GitHub schedule delivery can occasionally go quiet. This watchdog independently
# re-dispatches stale research/monitor workflows and also ensures the long-running
# self-hosted trading session is present without allowing an hourly queue backlog.

on:
  schedule:
    # Five-minute independent recovery cadence keeps freshness comfortably inside
    # the trading health SLO without weakening any stale-data gate.
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: teststock-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Re-dispatch static-scan.yml if published signal data has gone stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          generated_at=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('docs/signal.json','utf8')).generatedAt||'')}catch{console.log('')}")
          if [ -z "$generated_at" ]; then
            echo "No generatedAt in docs/signal.json; dispatching static scan if idle"
            age_min=9999
          else
            age_min=$(node -e "console.log(Math.max(0, Math.round((Date.now()-Date.parse('$generated_at'))/60000)))")
          fi
          echo "docs/signal.json is ${age_min} minutes old"
          if [ "$age_min" -lt 15 ]; then
            echo "Fresh enough; nothing to do"
            exit 0
          fi
          if gh run list --workflow static-scan.yml --limit 10 --json status | jq -e 'any(.[]; .status=="queued" or .status=="in_progress")' >/dev/null; then
            echo "A static-scan run is already queued or in progress; not duplicating it"
            exit 0
          fi
          echo "Signal is approaching its health limit and nothing is in flight; re-dispatching static-scan.yml"
          gh workflow run static-scan.yml --ref main

      - name: Re-dispatch fast-opportunity-refresh.yml if the canonical signal has gone stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # docs/signal.json is the canonical stock+crypto trading signal. The old
          # claude-signal.json path is legacy and could make the watchdog miss a stale
          # executable signal entirely.
          generated_at=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('docs/signal.json','utf8')).generatedAt||'')}catch{console.log('')}")
          if [ -z "$generated_at" ]; then
            age_min=9999
          else
            age_min=$(node -e "console.log(Math.max(0, Math.round((Date.now()-Date.parse('$generated_at'))/60000)))")
          fi
          echo "canonical docs/signal.json is ${age_min} minutes old"
          if [ "$age_min" -lt 12 ]; then
            echo "Fresh enough; nothing to do"
            exit 0
          fi
          if gh run list --workflow fast-opportunity-refresh.yml --limit 10 --json status | jq -e 'any(.[]; .status=="queued" or .status=="in_progress")' >/dev/null; then
            echo "A fast-opportunity-refresh run is already queued or in progress; not duplicating it"
            exit 0
          fi
          echo "Canonical signal is aging; dispatching fast-opportunity-refresh.yml"
          gh workflow run fast-opportunity-refresh.yml --ref main

      - name: Re-dispatch trigger-monitor.yml if trigger or intraday state is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trigger_at=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('docs/data/trigger-board.json','utf8')).publishedAt||'')}catch{console.log('')}")
          intraday_at=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('docs/data/intraday-edge.json','utf8')).generatedAt||'')}catch{console.log('')}")
          trigger_age=$(node -e "const t=Date.parse('$trigger_at'); console.log(Number.isFinite(t)?Math.max(0,Math.round((Date.now()-t)/60000)):9999)")
          intraday_age=$(node -e "const t=Date.parse('$intraday_at'); console.log(Number.isFinite(t)?Math.max(0,Math.round((Date.now()-t)/60000)):9999)")
          echo "trigger-board age=${trigger_age}m intraday-edge age=${intraday_age}m"
          if [ "$trigger_age" -lt 8 ] && [ "$intraday_age" -lt 10 ]; then
            echo "Trigger and intraday state are fresh enough"
            exit 0
          fi
          if gh run list --workflow trigger-monitor.yml --limit 10 --json status | jq -e 'any(.[]; .status=="queued" or .status=="in_progress")' >/dev/null; then
            echo "A trigger-monitor run is already queued or in progress; not duplicating it"
            exit 0
          fi
          echo "Trigger/intraday state is aging; re-dispatching trigger-monitor.yml"
          gh workflow run trigger-monitor.yml --ref main

      - name: Re-dispatch trading-health.yml if health publication is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          generated_at=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('docs/data/live-trading-health.json','utf8')).generatedAt||'')}catch{console.log('')}")
          age_min=$(node -e "const t=Date.parse('$generated_at'); console.log(Number.isFinite(t)?Math.max(0,Math.round((Date.now()-t)/60000)):9999)")
          echo "live-trading-health age=${age_min}m"
          if [ "$age_min" -lt 8 ]; then
            echo "Health publication is fresh enough"
            exit 0
          fi
          if gh run list --workflow trading-health.yml --limit 10 --json status | jq -e 'any(.[]; .status=="queued" or .status=="in_progress")' >/dev/null; then
            echo "A trading-health run is already queued or in progress; not duplicating it"
            exit 0
          fi
          echo "Health state is aging; dispatching trading-health.yml"
          gh workflow run trading-health.yml --ref main

      - name: Keep the live self-hosted trading session running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh run list --workflow live-intraday-runner.yml --limit 20 --json status,conclusion,createdAt,updatedAt)
          if echo "$runs" | jq -e 'any(.[]; .status=="queued" or .status=="in_progress")' >/dev/null; then
            echo "Live trading runner is already queued or in progress; nothing to do"
            exit 0
          fi
          last_finished=$(echo "$runs" | jq -r '[.[] | select(.status=="completed") | .updatedAt] | map(select(.!=null)) | sort | last // empty')
          if [ -z "$last_finished" ]; then
            echo "No completed live-runner session found; dispatching one now"
            gh workflow run live-intraday-runner.yml --ref main
            exit 0
          fi
          age_min=$(node -e "console.log(Math.max(0, Math.round((Date.now()-Date.parse('$last_finished'))/60000)))")
          echo "Most recent live-runner completion is ${age_min} minutes old"
          if [ "$age_min" -ge 5 ]; then
            echo "No live session is active; dispatching recovery session"
            gh workflow run live-intraday-runner.yml --ref main
          else
            echo "A session just completed; scheduled/watchdog recovery will take over if needed"
          fi
